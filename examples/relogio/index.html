<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>M.render: desenho preso ao relógio do filme</title>
<meta name="viewport" content="width=1920, height=1080">
<!-- Um relógio desenhado por M.render: o arco enche em 4 s, o ponto dá uma volta por segundo e um anel pulsa em cada segundo inteiro.
     A leitura no centro mostra o quadro (fr / fps); o desenho usa o t contínuo, então um sub-quadro do --shutter vê o seu próprio desenho.
     Autoteste: node kit/autoteste.mjs examples/relogio/index.html     Fotos: node scripts/render.mjs examples/relogio/index.html --still 0.2,1.1,3.5 stills
     Prévia com controles: abra file:///<caminho>/examples/relogio/index.html?previa no Chrome. O audio/mix.wav tem um bipe em cada segundo inteiro, junto do anel.
     Ele foi feito assim: ffmpeg -f lavfi -i "aevalsrc=exprs=0.5*sin(2*PI*880*t)*exp(-30*mod(t\,1)):s=8000:d=4" -ac 1 -c:a pcm_s16le audio/mix.wav -->
<link rel="stylesheet" href="../../runtime/fonts.css">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
#main { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; background: #EDEBE6; color: #101114; font-family: Inter, system-ui, sans-serif; font-weight: 500; }
#desenho { position: absolute; left: 0; top: 0; }
#titulo { position: absolute; left: 0; top: 64px; width: 1920px; text-align: center; font-size: 64px; line-height: 80px; white-space: pre; }
#leitura { position: absolute; left: 0; top: 470px; width: 1920px; text-align: center; font-size: 120px; line-height: 140px; font-variant-numeric: tabular-nums; }
#quadro { position: absolute; left: 0; top: 610px; width: 1920px; text-align: center; font-size: 36px; line-height: 44px; color: #6A6862; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="main">
  <svg id="desenho" width="1920" height="1080" viewBox="0 0 1920 1080" aria-hidden="true">
    <circle cx="960" cy="560" r="300" fill="none" stroke="#D8D4CC" stroke-width="18"/>
    <circle id="arco" cx="960" cy="560" r="300" fill="none" stroke="#101114" stroke-width="18" stroke-linecap="round" transform="rotate(-90 960 560)"/>
    <circle id="pulso" cx="960" cy="560" r="300" fill="none" stroke="#F2542D" stroke-width="6" opacity="0"/>
    <circle id="ponto" cx="960" cy="260" r="22" fill="#F2542D"/>
  </svg>
  <div id="titulo">Desenho preso ao relógio</div>
  <div id="leitura">0,00 s</div>
  <div id="quadro">quadro 0</div>
</div>

<script src="../../runtime/vendor/gsap.min.js"></script>
<script src="../../runtime/motion.js"></script>
<script>
const M = Motion.film({ fps: 30, duration: 4, width: 1920, height: 1080 });

// As chamadas de sempre convivem com o desenhista no mesmo relógio.
M.words('#titulo', { at: 2, mech: 'rise', dist: 40 });

// M.render: fn(t, quadro) roda a cada seek e reescreve o desenho do zero (função pura de t; nada guardado entre quadros).
const arco = document.getElementById('arco'), pulso = document.getElementById('pulso'), ponto = document.getElementById('ponto');
const leitura = document.getElementById('leitura'), quadro = document.getElementById('quadro');
const RAIO = 300, VOLTA = 2 * Math.PI * RAIO;
arco.setAttribute('stroke-dasharray', VOLTA.toFixed(2));
M.render((t, fr) => {
  arco.setAttribute('stroke-dashoffset', (VOLTA * (1 - t / M.duration)).toFixed(2));    // enche em 4 s
  const a = 2 * Math.PI * (t % 1) - Math.PI / 2;                                         // uma volta por segundo, a partir do topo
  ponto.setAttribute('cx', (960 + RAIO * Math.cos(a)).toFixed(2));
  ponto.setAttribute('cy', (560 + RAIO * Math.sin(a)).toFixed(2));
  const k = (t % 1) / 0.4;                                                               // o anel pulsa 0,4 s depois de cada segundo inteiro
  pulso.setAttribute('r', (RAIO + 90 * M.ease.softLand(Math.min(k, 1))).toFixed(2));
  pulso.setAttribute('opacity', k < 1 ? (1 - k).toFixed(3) : '0');
  leitura.textContent = (fr / M.fps).toFixed(2).replace('.', ',') + ' s';                // o texto segue o quadro, não o sub-quadro
  leitura.dataset.quadro = fr;
  quadro.textContent = 'quadro ' + fr;
});

window.__ready = Motion.loaded().then(() => { if (/selftest/.test(location.search)) Motion.selfTest(M, { samples: 24 }); });
</script>
</body>
</html>
